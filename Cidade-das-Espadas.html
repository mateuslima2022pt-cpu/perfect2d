<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect 2D — Cidade das Espadas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#22251a;color:#ede0c1;font:15px Georgia,serif}canvas{display:block}#world{width:100vw;height:100dvh;touch-action:none;cursor:grab}#world:active{cursor:grabbing}.panel{background:#1c211bf5;border:1px solid #9b8153;border-radius:3px;box-shadow:0 2px 16px #0009}header{position:fixed;top:14px;left:14px;padding:10px 15px;pointer-events:none}h1,h2,p{margin:0}h1{font-size:24px;font-weight:normal}#location{color:#e2c485;margin-top:4px}small{color:#c8bda0}aside{position:fixed;top:14px;right:14px;padding:6px}#mini{width:170px;height:auto;cursor:crosshair;border:1px solid #827253}.buttons{display:flex;gap:4px;margin-top:5px}button{background:#323528;border:1px solid #8d784e;color:inherit;font:inherit;padding:5px 9px;border-radius:2px;cursor:pointer}button:hover,button:focus-visible{outline:2px solid #e3c285;outline-offset:1px}footer{position:fixed;bottom:14px;left:14px;padding:6px 11px;pointer-events:none}dialog{width:min(900px,95vw);max-height:95dvh;padding:10px;color:inherit}dialog::backdrop{background:#141910b8}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}#atlas{width:min(100%,calc((95dvh - 125px)*1.5));height:auto;margin:auto;cursor:crosshair}#destinos{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:8px}#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px} @media(max-width:560px){h1{font-size:17px}header,aside{top:6px}header,footer{left:6px}aside{right:6px}#mini{width:109px}footer{font-size:11px}}
</style>
<canvas id="world" aria-label="Região inicial dos Humanos"></canvas>
<header class="panel"><h1>Cidade das Espadas</h1><p id="location">Terras dos Humanos</p><small id="coords"></small></header>
<aside class="panel"><canvas id="mini" width="300" height="200" aria-label="Minimapa"></canvas><div class="buttons"><button id="minus" aria-label="Afastar">−</button><button id="plus" aria-label="Aproximar">+</button><button id="open">Mapa M</button></div></aside>
<footer class="panel">WASD / setas · Arraste para mover · Roda para zoom</footer>
<div id="loading" class="panel" role="status">Carregando a região…</div>
<dialog id="dialog" class="panel"><div class="top"><h2>Terras dos Humanos</h2><button id="close">Fechar</button></div><canvas id="atlas" width="1020" height="680" aria-label="Mapa regional interativo"></canvas><div id="destinos"></div></dialog>
<script>
'use strict';
const by=id=>document.getElementById(id);
const screen=by('world'),g=screen.getContext('2d'),mini=by('mini'),atlas=by('atlas'),dialog=by('dialog');
const image=new Image();
const places=[
 ['Estalagem de Pengcheng',.23,.86],
 ['Campo de Caça',.36,.64],
 ['Clareira do Vale',.43,.44],
 ['Ponte de Pedra',.57,.62],
 ['Portão Sul',.82,.47],
 ['Praça da Cidade das Espadas',.84,.27]
];
let x=0,y=0,z=1,base=1,w=innerWidth,h=innerHeight,dpr=1,ready=false,dirty=true,drag=null;
const keys=new Set();
const clamp=(v,a,b)=>Math.min(b,Math.max(v,a));
function setCamera(nx,ny,nz=z){
 z=clamp(nz,base,Math.max(base*3,1.7));
 x=clamp(nx,0,image.width);y=clamp(ny,0,image.height);dirty=true;
}
function resize(){
 w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 screen.width=Math.round(w*dpr);screen.height=Math.round(h*dpr);
 if(ready){base=Math.min(w/image.width,h/image.height);setCamera(x,y);}
}
function go(p){setCamera(p[1]*image.width,p[2]*image.height,Math.max(z,base*1.9));}
function plot(c,details){
 const draw=c.getContext('2d'),a=c.width,b=c.height;
 draw.drawImage(image,0,0,a,b);
 if(details){
  draw.font='16px Georgia';draw.textAlign='center';draw.lineWidth=4;
  for(const [label,u,v] of places){
   draw.strokeStyle='#171912';draw.fillStyle='#f7e2aa';
   draw.beginPath();draw.arc(u*a,v*b,4,0,Math.PI*2);draw.fill();draw.stroke();
   draw.strokeText(label,u*a,v*b-10);draw.fillText(label,u*a,v*b-10);
  }
 }
 const cx=x/image.width*a,cy=y/image.height*b;
 const vw=w/z/image.width*a,vh=h/z/image.height*b;
 draw.lineWidth=details?2:1;draw.strokeStyle='#fff1b9';
 draw.strokeRect(cx-vw/2,cy-vh/2,vw,vh);
 draw.beginPath();draw.arc(cx,cy,details?7:4,0,Math.PI*2);draw.stroke();
}
function render(){
 g.setTransform(dpr,0,0,dpr,0,0);
 g.fillStyle='#22251a';g.fillRect(0,0,w,h);
 g.drawImage(image,w/2-x*z,h/2-y*z,image.width*z,image.height*z);
 g.strokeStyle='#fff0be';g.beginPath();g.arc(w/2,h/2,5,0,Math.PI*2);g.stroke();
 plot(mini,false);if(dialog.open)plot(atlas,true);
 const nearest=places.reduce((best,p)=>{
  const d=Math.hypot(x/image.width-p[1],y/image.height-p[2]);return d<best.d?{name:p[0],d}:best;
 },{name:'Terras dos Humanos',d:.17});
 by('location').textContent=nearest.name;
 by('coords').textContent='X '+Math.round(x)+' · Y '+Math.round(y)+' · '+Math.round(z/base*100)+'%';
}
function toggle(){
 if(!ready)return;
 if(dialog.open){dialog.close();return;}
 keys.clear();dialog.showModal();plot(atlas,true);
}
function point(e,c){
 if(!ready)return;
 const r=c.getBoundingClientRect();
 setCamera((e.clientX-r.left)/r.width*image.width,(e.clientY-r.top)/r.height*image.height);
 if(dialog.open)dialog.close();
}
function zoom(f,px=w/2,py=h/2){
 if(!ready)return;
 const next=clamp(z*f,base,Math.max(base*3,1.7));
 setCamera(x+(px-w/2)*(1/z-1/next),y+(py-h/2)*(1/z-1/next),next);
}
for(const p of places){
 const b=document.createElement('button');b.textContent=p[0];
 b.onclick=()=>{go(p);dialog.close();};by('destinos').append(b);
}
by('open').onclick=toggle;by('close').onclick=()=>dialog.close();
by('plus').onclick=()=>zoom(1.2);by('minus').onclick=()=>zoom(1/1.2);
mini.onclick=e=>point(e,mini);atlas.onclick=e=>point(e,atlas);
const controls=['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright'];
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='m'&&!e.repeat){e.preventDefault();toggle();return;}
 if(dialog.open)return;
 if(controls.includes(k)){e.preventDefault();keys.add(k);}
 if(k==='+'||k==='=')zoom(1.2);
 if(k==='-')zoom(1/1.2);
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{keys.clear();drag=null;});
addEventListener('resize',resize);
screen.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-clamp(e.deltaY,-300,300)*.002),e.clientX,e.clientY);},{passive:false});
screen.onpointerdown=e=>{
 if(!ready||!e.isPrimary||e.button!==0)return;
 screen.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY];
};
screen.onpointermove=e=>{
 if(!drag||!e.isPrimary)return;
 setCamera(x+(drag[0]-e.clientX)/z,y+(drag[1]-e.clientY)/z);
 drag=[e.clientX,e.clientY];
};
for(const name of ['pointerup','pointercancel','lostpointercapture'])screen.addEventListener(name,()=>drag=null);
let last=0;
function frame(t){
 const dt=Math.min((t-last)/1000,.05);last=t;
 function axis(a,b,c,d){return Number(keys.has(a)||keys.has(b))-Number(keys.has(c)||keys.has(d));}
 const dx=axis('d','arrowright','a','arrowleft'),dy=axis('s','arrowdown','w','arrowup');
 if(dx||dy){const speed=380*dt/z/Math.hypot(dx,dy);setCamera(x+dx*speed,y+dy*speed);}
 if(dirty){dirty=false;render();}
 requestAnimationFrame(frame);
}
image.onload=()=>{
 ready=true;resize();go(places[0]);by('loading').hidden=true;requestAnimationFrame(frame);
};
image.onerror=()=>{by('loading').textContent='Não foi possível abrir a arte da região.';};
