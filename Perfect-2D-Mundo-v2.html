<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect 2D — Mundo</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--gold:#c6a46a;--cream:#f6e8c7;--ink:#101c19;--line:#7f6745}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#23332c,#090f0e 70%);color:var(--cream);font:15px Georgia,serif}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffe2a1;outline-offset:3px}
.shell{width:min(1500px,100%,max(720px,calc((100dvh - 116px)*16/9)));border:1px solid #605039;box-shadow:0 18px 60px #0008;overflow:hidden;background:#101c19}
header{display:flex;align-items:center;gap:2rem;padding:13px 24px;border-bottom:1px solid #ad8c50;background:linear-gradient(#222d25,#121d19)}
.brand{color:#f3d28b;font-size:clamp(19px,2vw,29px);font-weight:bold;white-space:nowrap;text-shadow:0 2px #482916;letter-spacing:.025em}.brand em{color:#e99a61;font-style:normal}
nav{display:flex;flex:1;overflow:auto;gap:4px;justify-content:space-between}
.nav{flex:0 0 auto;color:#cbc0a3;border:1px solid transparent;background:none;border-radius:4px;padding:.55em .65em}
.nav:hover{color:#fff0c8;background:#e4c68e18}.nav[aria-current]{color:#ffe2ab;background:linear-gradient(#56442a,#332a1e);border-color:#9a7648}
#board{position:relative;aspect-ratio:16/9;isolation:isolate;overflow:hidden;background:#20332b}
#art{position:absolute;width:100%;height:100%;object-fit:fill}
#board::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 55px 12px #161d14a0}
.city{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:1;display:grid;justify-items:center;gap:5px;background:none;border:0;padding:4px;color:#251c11;transition:filter .15s,transform .15s}
.city::before{content:"";display:block;width:11px;height:11px;transform:rotate(45deg);background:#e9c386;border:2px solid #52381f;outline:1px solid #d7b77d;box-shadow:0 2px 8px #15160d}
.city span{white-space:nowrap;font-size:clamp(11px,1.17vw,18px);font-weight:bold;padding:.27em .66em;background:linear-gradient(165deg,#f6e6bb,#d6ad70);border:1px solid #7d582e;clip-path:polygon(3% 2%,98% 0,100% 19%,98% 51%,100% 90%,96% 100%,2% 98%,0 77%,2% 44%,0 13%);filter:drop-shadow(0 2px 1px #20160c)}
.city:hover,.city:focus-visible{transform:translate(-50%,-55%) scale(1.08);filter:brightness(1.14);z-index:3}
.city[data-locked]:hover span,.city[data-locked]:focus-visible span{color:#701c20;background:linear-gradient(#f4c5a7,#d89273)}
.city[data-locked]:hover::before{background:#ed8871}
.city[data-home]::before{background:#ccf1d1;outline-color:#c9e6bd;box-shadow:0 0 12px #e1ecc5}
#feedback{position:absolute;z-index:4;width:max-content;max-width:80%;padding:.7em 1em;background:#261816f8;border:1px solid #ce715e;border-radius:5px;color:#ffac9c;box-shadow:0 5px 18px #0007;pointer-events:none;font-size:clamp(12px,1.15vw,16px)}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 24px;border-top:1px solid #9e7f4d;color:#c7b89b}
footer strong{color:#e9d3a2;font-size:16px;font-weight:normal;letter-spacing:.04em}
.controls,dialog button{color:#f7e5bd;background:linear-gradient(#304238,#1b2d25);border:1px solid #8f764e;border-radius:4px;padding:.55em .85em}
.controls:hover,dialog button:hover{background:#3e4e3a}
dialog{margin:auto clamp(14px,5vw,80px) auto auto;width:min(92vw,390px);background:linear-gradient(145deg,#26382e,#111e19);border:1px solid #b0925a;border-radius:7px;color:inherit;padding:24px;box-shadow:0 18px 60px #000c}
dialog::backdrop{background:#06110d88}
dialog h1{font-size:1.56rem;margin:0 0 12px;color:#f3d38c}dialog p{line-height:1.5}form{display:grid;gap:12px}label{display:flex;align-items:center;justify-content:space-between;gap:15px}select,input{color:#f7e6ba;background:#0d2018;border:1px solid #8d774c;border-radius:4px;padding:5px 8px}input{width:5em}.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
@media(max-width:850px){header{gap:10px;padding:9px 12px}nav{justify-content:start}.nav{font-size:13px}footer{padding:8px 12px}}
@media(max-width:570px){header{display:block}.brand{margin-bottom:5px}#board{aspect-ratio:5/4}.city span{font-size:10px;white-space:normal;text-align:center;min-width:39px;max-width:72px}.city::before{width:7px;height:7px}.city{gap:3px;padding:2px}}
@media(prefers-reduced-motion:reduce){.city{transition:none}}
</style>
<div class="shell">
<header><div class="brand" aria-label="Perfect 2D">Perfect <em>2D</em></div><nav id="nav" aria-label="Menu principal"></nav></header>
<main id="board" aria-label="Mapa do Mundo do Perfect 2D">
<img id="art" alt="" draggable="false">
<section id="cities" aria-label="Destinos"></section>
<div id="feedback" role="status" hidden></div>
</main>
<footer><strong>Mapa do mundo</strong><button id="test" class="controls">Personagem de teste</button></footer>
</div>
<dialog id="panel" aria-labelledby="title">
<h1 id="title"></h1>
<div id="contents"></div>
</dialog>

let player={level:1,race:'Humanos'},timer;
const cities=[
 ['Cidade Universal',90,100,null,11,25],

];
const menu=['Mundo','Dungeons','Inventário','Habilidades','Loja','Forja','Guilda','Arena','TW'];
function element(tag,value){
 const node=document.createElement(tag);node.textContent=value;return node;
}
function clearWarning(){clearTimeout(timer);feedback.hidden=true;feedback.textContent='';}
function show(title){
 clearWarning();get('title').textContent=title;contents.replaceChildren();
 if(!panel.open)panel.showModal();
}
function actions(...buttons){
 const box=element('div','');box.className='actions';box.append(...buttons);contents.append(box);
}
function control(text,fn){
 const b=element('button',text);b.type='button';b.onclick=fn;return b;
}
const close=()=>control('Voltar',()=>panel.close());
function deny(button,first,second){
 clearWarning();
 feedback.append(element('div',first));
 if(second)feedback.append(element('div',second));
 feedback.hidden=false;
 const area=get('board').getBoundingClientRect(),target=button.getBoundingClientRect();
 const x=Math.min(target.right-area.left+4,area.width-feedback.offsetWidth-8);
 const y=Math.min(target.bottom-area.top+6,area.height-feedback.offsetHeight-8);
 feedback.style.left=Math.max(8,x)+'px';feedback.style.top=Math.max(8,y)+'px';
 timer=setTimeout(clearWarning,5500);
}
function restriction(city){
 const [,min,,race]=city;
 if(player.level<min)return ['Você não tem nível suficiente.','Alcance o nível '+min+' para entrar na área.'];
 if(race&&player.race!==race)return ['Área exclusiva para '+race+'.'];
 return null;
}
function room(city){
 show('Criar sala');
 contents.append(element('p','Ruínas da Sentinela · '+city[0]));
 const form=element('form',''),difficulty=element('select','');
 for(const name of ['Normal','Difícil'])difficulty.add(new Option(name,name));
 const label=element('label','Dificuldade');label.append(difficulty);form.append(label);
 const submit=element('button','Criar sala de teste');submit.className='controls';form.append(submit);
 form.onsubmit=e=>{
  e.preventDefault();show('Sala de teste');
  contents.append(element('p','Ruínas da Sentinela · '+difficulty.value+' · Solo'));
  contents.append(element('p','Combate ainda indisponível neste protótipo.'));
  actions(close());
 };
 contents.append(form);actions(control('Voltar',()=>openCity(city)));
}
function openCity(city){
 const [name,min,max,race]=city;
 show(name);
 contents.append(element('p','Níveis '+min+'–'+max+' · '+(race?'Apenas '+race:'Solo ou Coop')));
 if(name==='Cidade das Espadas'){
  contents.append(element('p','Fase de teste · Ruínas da Sentinela'));
  actions(close(),control('Escolher dificuldade',()=>room(city)));
 }else{
  contents.append(element('p','Fases ainda em preparação.'));actions(close());
 }
}
const markers=cities.map(city=>{
 const [name,,,,x,y]=city;
 const button=element('button','');button.className='city';
 button.append(element('span',name));
 button.style.setProperty('--x',x+'%');button.style.setProperty('--y',y+'%');
 button.onclick=()=>{const error=restriction(city);if(error)deny(button,...error);else openCity(city);};
 get('cities').append(button);return [button,city];
});
function refresh(){
 for(const [button,city] of markers){
  button.toggleAttribute('data-locked',Boolean(restriction(city)));
  button.toggleAttribute('data-home',city[3]===player.race);
 }
 get('test').textContent=player.race+' · Nv. '+player.level;
}
for(const name of menu){
 const b=element('button',name);b.className='nav';
 if(name==='Mundo')b.setAttribute('aria-current','page');
 b.onclick=()=>{
  if(name==='Mundo'){clearWarning();return;}
  show(name);
  if(name==='Dungeons'){
   contents.append(element('p','Escolha uma área no mapa para ver suas fases.'));
   actions(control('Abrir mapa',()=>panel.close()));
  }else{
   contents.append(element('p','Aba em preparação.'));actions(close());
  }
 };
 get('nav').append(b);
}
get('test').onclick=()=>{
 show('Personagem de teste');
 const form=element('form',''),race=element('select',''),level=element('input','');
 for(const name of ['Humanos','Selvagens','Alados'])race.add(new Option(name,name));
 race.value=player.race;level.type='number';level.min=1;level.max=105;level.required=true;level.value=player.level;
 const a=element('label','Raça'),b=element('label','Nível');a.append(race);b.append(level);
 const submit=element('button','Aplicar');form.append(a,b,submit);
 form.onsubmit=e=>{e.preventDefault();player={race:race.value,level:Number(level.value)};refresh();panel.close();};
 contents.append(form);actions(close());
};
addEventListener('resize',clearWarning);
refresh();
</script>
</html>
