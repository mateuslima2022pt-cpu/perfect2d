<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect 2D — Mundo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#081411;color:#f7e6ba;font:16px Georgia,serif}
button,input,select{font:inherit}
button{cursor:pointer}
#board{position:relative;width:min(100vw,177.7dvh);aspect-ratio:1672/941;isolation:isolate;background:#103128}
#art{position:absolute;width:100%;height:100%;object-fit:fill}
.hot{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border:0;background:none;border-radius:8px;padding:0;color:inherit}
.hot:focus-visible{outline:3px solid #ffe6a3;outline-offset:2px}
.hot:hover,.hot:focus-visible{z-index:3}
.city::before{content:"";position:absolute;inset:0;background:var(--art) var(--bx) var(--by)/var(--bw) var(--bh) no-repeat;opacity:0;transition:opacity .12s,transform .12s;pointer-events:none;mask-image:linear-gradient(transparent,#000 18%,#000 88%,transparent);border-radius:12px}
.city:hover::before,.city:focus-visible::before{opacity:1;transform:translateY(-3%) scale(1.04);filter:brightness(1.13) saturate(1.2)}
.city[data-locked]:hover::before,.city[data-locked]:focus-visible::before{filter:sepia(.52) saturate(2) hue-rotate(318deg) brightness(.95)}
.nav:hover{background:#ffcc6930;box-shadow:inset 0 0 0 1px #ffde8c}
#feedback{position:absolute;z-index:4;width:max-content;max-width:80%;padding:.47em .65em;background:#160e0cf5;border:1px solid #e75443;border-radius:4px;color:#ff7161;box-shadow:0 3px 8px #000a;pointer-events:none;font-size:clamp(12px,1.15vw,19px)}
#test{position:absolute;bottom:1.2%;right:2%;padding:.25em .6em;font-size:clamp(10px,1vw,16px)}
.controls,dialog button{color:#f7e6ba;background:#14362c;border:1px solid #a9874a;border-radius:5px;padding:.45em .75em}
dialog{width:min(92vw,430px);background:linear-gradient(#173329,#0d211c);border:1px solid #c5a261;border-radius:8px;color:inherit;padding:23px;box-shadow:0 12px 45px #000a}
dialog::backdrop{background:#0008}
dialog h1{font-size:1.52rem;margin:0 0 12px;color:#f3d38c}
dialog p{line-height:1.45}
form{display:grid;gap:12px}
label{display:flex;align-items:center;justify-content:space-between;gap:15px}
select,input{color:#f7e6ba;background:#0b201a;border:1px solid #8d774c;border-radius:4px;padding:5px 8px}
input{width:5em}
.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffe6a3;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.city::before{transition:none}}
</style>
<main id="board" aria-label="Mapa do Mundo do Perfect 2D">
<img id="art" alt="" draggable="false">
<nav id="nav" aria-label="Menu principal"></nav>
<section id="cities" aria-label="Destinos"></section>
<div id="feedback" role="status" hidden></div>
<button id="test" class="controls">Personagem de teste</button>
</main>
<dialog id="panel" aria-labelledby="title">
<h1 id="title"></h1>
<div id="contents"></div>
</dialog>

get('board').style.setProperty('--art','url("'+image+'")');
const feedback=get('feedback'),panel=get('panel'),contents=get('contents');
let player={level:1,race:'Humanos'},timer;
const cities=[
 ['Cidade Universal',90,100,null,13.6,19.5,10.8,12.4],
 ['Frost',100,105,null,43.4,12.9,8.2,12.3],
 ['Cidade de Fei Wei',50,59,null,62.2,21.6,11.2,11],
 ['Portão Desalmado',70,79,null,82.1,13.2,11.1,12.6],
 ['Cidade das Feras',1,19,'Selvagens',4.9,43.2,11.2,11.6],
 ['Cidade dos Dragões',20,39,null,43.2,47.9,12.2,13.3],
 ['Cidade das Espadas',1,19,'Humanos',64.7,38.3,12.4,13.4],
 ['Cidade da Dor Celestial',40,49,null,82.6,47.9,13.8,14],
 ['Cidade da Presa',60,69,null,18,60.2,10.7,12.3],
 ['Cidade das Plumas',1,19,'Alados',34.1,72,11.5,12.3],
 ['Porto dos Sonhos',80,89,null,64.1,73.2,13,12.2]
];
const menu=[
 ['Mundo',20,8.8],['Dungeons',29.6,9.2],['Inventário',39.4,9.3],['Habilidades',49.6,9.5],
 ['Loja',59.9,6.9],['Forja',67.5,7.3],['Guilda',75.5,7.4],['Arena',83.5,7.5],['TW',91.6,6.1]
];
function element(tag,value){
 const node=document.createElement(tag);node.textContent=value;return node;
}
function hit(name,x,y,w,h,kind){
 const button=element('button','');
 button.className='hot '+kind;button.setAttribute('aria-label',name);
 const values={x,y,w,h,bx:100*x/(100-w),by:100*y/(100-h),bw:10000/w,bh:10000/h};
 for(const [key,value] of Object.entries(values))button.style.setProperty('--'+key,value+'%');
 return button;
}
function clearWarning(){clearTimeout(timer);feedback.hidden=true;feedback.textContent='';}
function show(title){
 clearWarning();get('title').textContent=title;contents.replaceChildren();
 if(!panel.open)panel.showModal();
}
function actions(...buttons){
 const box=element('div','');box.className='actions';box.append(...buttons);contents.append(box);
}
function control(text,fn){
 const b=element('button',text);b.type='button';b.onclick=fn;return b;
}
const close=()=>control('Voltar',()=>panel.close());
function deny(button,first,second){
 clearWarning();
 feedback.append(element('div',first));
 if(second)feedback.append(element('div',second));
 feedback.hidden=false;
 const area=get('board').getBoundingClientRect(),target=button.getBoundingClientRect();
 const x=Math.min(target.right-area.left+4,area.width-feedback.offsetWidth-8);
 const y=Math.min(target.bottom-area.top+6,area.height-feedback.offsetHeight-8);
 feedback.style.left=Math.max(8,x)+'px';feedback.style.top=Math.max(8,y)+'px';
 timer=setTimeout(clearWarning,5500);
}
function restriction(city){
 const [,min,,race]=city;
 if(player.level<min)return ['Você não tem nível suficiente.','Alcance o nível '+min+' para entrar na área.'];
 if(race&&player.race!==race)return ['Área exclusiva para '+race+'.'];
 return null;
}
function room(city){
 show('Criar sala');
 contents.append(element('p','Ruínas da Sentinela · '+city[0]));
 const form=element('form',''),difficulty=element('select','');
 for(const name of ['Normal','Difícil'])difficulty.add(new Option(name,name));
 const label=element('label','Dificuldade');label.append(difficulty);form.append(label);
 const submit=element('button','Criar sala de teste');submit.className='controls';form.append(submit);
 form.onsubmit=e=>{
  e.preventDefault();show('Sala de teste');
  contents.append(element('p','Ruínas da Sentinela · '+difficulty.value+' · Solo'));
  contents.append(element('p','Combate ainda indisponível neste protótipo.'));
  actions(close());
 };
 contents.append(form);actions(control('Voltar',()=>openCity(city)));
}
function openCity(city){
 const [name,min,max,race]=city;
 show(name);
 contents.append(element('p','Níveis '+min+'–'+max+' · '+(race?'Apenas '+race:'Solo ou Coop')));
 if(name==='Cidade das Espadas'){
  contents.append(element('p','Fase de teste · Ruínas da Sentinela'));
  actions(close(),control('Escolher dificuldade',()=>room(city)));
 }else{
  contents.append(element('p','Fases ainda em preparação.'));actions(close());
 }
}
const markers=cities.map(city=>{
 const [name,,,,x,y,w,h]=city,button=hit(name,x,y,w,h,'city');
 button.onclick=()=>{const error=restriction(city);if(error)deny(button,...error);else openCity(city);};
 get('cities').append(button);return [button,city];
});
function refresh(){
 for(const [button,city] of markers)button.toggleAttribute('data-locked',Boolean(restriction(city)));
 get('test').textContent=player.race+' · Nv. '+player.level;
}
for(const [name,x,w] of menu){
 const b=hit(name,x,.5,w,5.2,'nav');
 if(name==='Mundo')b.setAttribute('aria-current','page');
 b.onclick=()=>{
  if(name==='Mundo'){clearWarning();return;}
  show(name);
  if(name==='Dungeons'){
   contents.append(element('p','Escolha uma área no mapa para ver suas fases.'));
   actions(control('Abrir mapa',()=>panel.close()));
  }else{
   contents.append(element('p','Aba em preparação.'));actions(close());
  }
 };
 get('nav').append(b);
}
get('test').onclick=()=>{
 show('Personagem de teste');
 const form=element('form',''),race=element('select',''),level=element('input','');
 for(const name of ['Humanos','Selvagens','Alados'])race.add(new Option(name,name));
 race.value=player.race;level.type='number';level.min=1;level.max=105;level.required=true;level.value=player.level;
 const a=element('label','Raça'),b=element('label','Nível');a.append(race);b.append(level);
 const submit=element('button','Aplicar');form.append(a,b,submit);
 form.onsubmit=e=>{e.preventDefault();player={race:race.value,level:Number(level.value)};refresh();panel.close();};
 contents.append(form);actions(close());
};
addEventListener('resize',clearWarning);
refresh();
</script>
